services:
  - type: web
    name: repobrain
    runtime: python
    region: singapore  # closest Render region to the FalkorDB Cloud instance in ap-south-1
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/repos
    envVars:
      - key: FALKORDB_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: REVIEW_KEY
        generateValue: true
      - key: POST_OWNERS
        value: SanidhyaDhangar
