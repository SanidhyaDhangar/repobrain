<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoBrain</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root { --bg:#0f1117; --panel:#161a23; --line:#262b38; --text:#d6dae5; --muted:#7d8597; --accent:#7aa2f7; --warn:#e0af68; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 8px 0 0; } header h1 span { color:var(--accent); }
  input, select, button, textarea { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  button { cursor:pointer; } button.primary { background:var(--accent); color:#0f1117; border:none; font-weight:600; }
  button:disabled { opacity:.5; cursor:wait; }
  .muted { color:var(--muted); font-size:12px; }
  main { flex:1; display:grid; grid-template-columns:minmax(360px, 44%) 1fr; min-height:0; }
  #left { display:flex; flex-direction:column; border-right:1px solid var(--line); min-height:0; }
  .tabs { display:flex; border-bottom:1px solid var(--line); } .tabs button { border:none; border-radius:0; background:none; padding:10px 16px; color:var(--muted); }
  .tabs button.on { color:var(--text); box-shadow:inset 0 -2px var(--accent); }
  .pane { flex:1; display:flex; flex-direction:column; min-height:0; } .pane[hidden] { display:none; }
  #log, #reviewOut { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:10px 14px; border-radius:8px; max-width:100%; overflow-wrap:anywhere; }
  .user { align-self:flex-end; background:#22304d; }
  .bot { background:var(--panel); border:1px solid var(--line); cursor:pointer; }
  .bot.active { border-color:var(--accent); }
  .bot p:first-child { margin-top:0; } .bot p:last-child { margin-bottom:0; }
  .bot code { background:#0b0d12; padding:1px 4px; border-radius:4px; font-size:12.5px; }
  details { margin-top:8px; } summary { color:var(--muted); font-size:12px; cursor:pointer; }
  .step { margin:8px 0; font-size:12px; } .step b { color:var(--accent); }
  pre { background:#0b0d12; padding:8px; border-radius:6px; overflow-x:auto; white-space:pre-wrap; font-size:11.5px; margin:4px 0; }
  pre.res { color:var(--muted); max-height:180px; overflow-y:auto; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 8px; }
  .chips button { font-size:12px; padding:4px 10px; border-radius:999px; }
  form.ask { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  form.ask textarea { flex:1; resize:none; height:42px; }
  .agent { border-left:3px solid var(--accent); } .agent h3 { margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); }
  .fact { cursor:default; margin-bottom:10px; } .fact .muted { margin-top:6px; }
  .badge { font-size:11px; padding:1px 7px; border-radius:999px; background:#1f3a2e; color:#9ece6a; }
  .badge.stale { background:#3d2a1a; color:var(--warn); }
  #right { position:relative; min-height:0; } #graph { position:absolute; inset:0; }
  #legend { position:absolute; left:12px; bottom:12px; display:flex; gap:10px; flex-wrap:wrap; font-size:12px; background:#0f1117cc; padding:6px 10px; border-radius:6px; }
  #legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  #graphTitle { position:absolute; left:12px; top:10px; font-size:12px; color:var(--muted); }
  @media (max-width: 800px) { main { grid-template-columns:1fr; grid-template-rows:60vh 40vh; } #left { border-right:none; } }
</style>
</head>
<body>
<header>
  <h1>Repo<span>Brain</span></h1>
  <select id="repo" aria-label="Repository"></select>
  <form id="ingestForm" style="display:flex;gap:6px">
    <input id="newRepo" placeholder="owner/name or GitHub URL" aria-label="Repository to ingest" size="26">
    <button>Ingest</button>
  </form>
  <span id="status" class="muted"></span>
  <span style="flex:1"></span>
  <span class="muted">session <code id="sess"></code></span>
  <button id="newSession" title="Start a new session: chat history resets, long-term memory stays">New session</button>
</header>
<main>
  <section id="left">
    <div class="tabs">
      <button class="on" data-tab="chat">Ask</button>
      <button data-tab="review">PR review (3 agents)</button>
      <button data-tab="memory">Memory</button>
    </div>
    <div class="pane" id="chat">
      <div id="log"></div>
      <div class="chips" id="chips"></div>
      <form class="ask" id="askForm">
        <textarea id="q" placeholder="Ask about the code, its history or the people behind it…" aria-label="Question"></textarea>
        <button class="primary">Ask</button>
      </form>
    </div>
    <div class="pane" id="review" hidden>
      <form class="ask" id="reviewForm" style="border-top:none;border-bottom:1px solid var(--line);align-items:center">
        <label>PR # <input id="prNum" type="number" min="1" required style="width:100px"></label>
        <label class="muted"><input type="checkbox" id="post"> post comment on GitHub</label>
        <input id="reviewKey" type="password" placeholder="review key" aria-label="Review key (needed to post)" size="10">
        <button class="primary">Run review</button>
      </form>
      <div id="reviewOut"><p class="muted">The impact agent maps the blast radius, the historian digs up past decisions, and the reviewer picks people and writes the comment. They hand off through Task and Note nodes in the graph.</p></div>
    </div>
    <div class="pane" id="memory" hidden>
      <div id="memoryOut" style="flex:1;overflow-y:auto;padding:16px"></div>
    </div>
  </section>
  <section id="right">
    <div id="graph"></div>
    <div id="graphTitle">Graph</div>
    <div id="legend"></div>
  </section>
</main>
<script>
const COLORS = { Function:'#7aa2f7', File:'#9ece6a', PR:'#bb9af7', Issue:'#f7768e', Person:'#e0af68', Fact:'#2ac3de', Episode:'#565f89', Task:'#ff9e64', Note:'#c0caf5' };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => DOMPurify.sanitize(marked.parse(s || ''));
const store = { get: k => { try { return localStorage.getItem(k) } catch { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} } };

async function api(path, body) {
  const r = await fetch(path, body ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

// ---- graph ----
const nodes = new vis.DataSet(), edges = new vis.DataSet();
const network = new vis.Network($('#graph'), { nodes, edges }, {
  groups: Object.fromEntries(Object.entries(COLORS).map(([k, c]) => [k, { color: { background:c, border:c, highlight:{ background:'#fff', border:c } } }])),
  nodes: { shape:'dot', size:11, font:{ color:'#d6dae5', size:12, strokeWidth:3, strokeColor:'#0f1117' } },
  edges: { arrows:{ to:{ scaleFactor:.5 } }, color:{ color:'#3b4261', highlight:'#7aa2f7' }, font:{ size:9, color:'#7d8597', strokeWidth:0 }, smooth:{ type:'continuous' } },
  physics: { barnesHut:{ gravitationalConstant:-5000, springLength:110 }, stabilization:{ iterations:200 } },
  interaction: { hover:true, tooltipDelay:120 },
});
function show(g, title) {
  nodes.clear(); edges.clear();
  nodes.add(g.nodes); edges.add(g.edges);
  $('#graphTitle').textContent = `${title} · ${g.nodes.length} nodes, ${g.edges.length} edges`;
  setTimeout(() => network.fit({ animation:true }), 300);
}
function merge(graphs) {
  const n = new Map(), e = new Map();
  graphs.forEach(g => { g.nodes.forEach(x => n.set(x.id, x)); g.edges.forEach(x => e.set(x.id, x)); });
  return { nodes:[...n.values()], edges:[...e.values()] };
}
$('#legend').innerHTML = Object.entries(COLORS).map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join('');

// ---- repos ----
let repo = store.get('rb-repo');
async function loadRepos() {
  const list = await api('/api/repos');
  $('#repo').innerHTML = list.map(r => `<option value="${esc(r.repo)}">${esc(r.repo)}${r.status === 'ready' ? '' : ' (' + esc(r.status) + ')'}</option>`).join('') || '<option value="">no repos yet: ingest one</option>';
  if (!list.some(r => r.repo === repo)) repo = list[0]?.repo || '';
  $('#repo').value = repo;
  const cur = list.find(r => r.repo === repo);
  $('#status').textContent = cur ? (cur.status === 'ready' ? `synced ${new Date(cur.synced_at).toLocaleString()}` : cur.status === 'error' ? `error: ${cur.error}` : 'ingesting… (about a minute)') : '';
  if (list.some(r => r.status === 'ingesting')) setTimeout(loadRepos, 4000);
  return cur;
}
async function selectRepo(r) {
  repo = r; store.set('rb-repo', r);
  const cur = await loadRepos();
  if (cur?.status === 'ready') show(await api('/api/overview?repo=' + encodeURIComponent(repo)), 'Most central code (PageRank) and who wrote it');
}
$('#repo').onchange = e => selectRepo(e.target.value);
$('#ingestForm').onsubmit = async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button'); btn.disabled = true;
  try { const r = await api('/api/ingest', { repo: $('#newRepo').value }); $('#newRepo').value = ''; await selectRepo(r.repo); }
  catch (err) { $('#status').textContent = err.message; }
  btn.disabled = false;
};

// ---- session (chat history resets per session; facts in the graph do not) ----
let session = store.get('rb-session');
function newSession() { session = 's-' + Math.random().toString(36).slice(2, 8); store.set('rb-session', session); $('#sess').textContent = session; $('#log').innerHTML = ''; }
if (session) $('#sess').textContent = session; else newSession();
$('#newSession').onclick = newSession;

// ---- chat ----
const EXAMPLES = ['Which functions are most critical, and is anyone the only person who understands them?',
  'What breaks if I change full_dispatch_request?', 'Why does full_dispatch_request look the way it does?',
  'Who should review a change to app.py, and why?', 'How is @pgjones connected to url_for?'];
$('#chips').innerHTML = EXAMPLES.map(x => `<button type="button">${esc(x)}</button>`).join('');
$('#chips').onclick = e => { if (e.target.tagName === 'BUTTON') { $('#q').value = e.target.textContent; $('#q').focus(); } };
$('#q').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#askForm').requestSubmit(); } };

function addMsg(cls, html) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html;
  $('#log').append(d); d.scrollIntoView({ behavior:'smooth', block:'end' }); return d;
}
function stepsHtml(steps) {
  return `<details><summary>${steps.length} graph quer${steps.length === 1 ? 'y' : 'ies'} behind this answer</summary>` + steps.map(s =>
    `<div class="step"><b>${esc(s.tool)}</b>(${esc(JSON.stringify(s.args))})<pre>${esc((s.cypher || []).join('\n\n'))}</pre><pre class="res">${esc(s.result)}</pre></div>`).join('') + '</details>';
}
$('#askForm').onsubmit = async e => {
  e.preventDefault();
  const q = $('#q').value.trim(); if (!q || !repo) return;
  $('#q').value = ''; addMsg('user', esc(q));
  const d = addMsg('bot', '<span class="muted">Traversing the graph…</span>');
  try {
    const r = await api('/api/ask', { repo, question:q, session });
    d.innerHTML = md(r.answer) + stepsHtml(r.steps);
    d.onclick = ev => { if (ev.target.closest('details')) return; document.querySelectorAll('.bot').forEach(x => x.classList.remove('active')); d.classList.add('active'); show(r.graph, 'Evidence for: ' + q.slice(0, 60)); };
    d.onclick({ target:d });
  } catch (err) { d.innerHTML = `<span style="color:var(--warn)">${esc(err.message)}</span>`; }
};

// ---- PR review ----
document.querySelector('.tabs').onclick = e => {
  const t = e.target.dataset.tab; if (!t) return;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === e.target));
  document.querySelectorAll('.pane').forEach(p => p.hidden = p.id !== t);
  if (t === 'memory') loadMemory();
};

// ---- memory ----
async function loadMemory() {
  if (!repo) return;
  $('#memoryOut').innerHTML = '<p class="muted">Loading…</p>';
  try {
    const m = await api('/api/memory?repo=' + encodeURIComponent(repo));
    const stale = m.facts.filter(f => f.stale).length;
    $('#memoryOut').innerHTML = `<p class="muted">${m.facts.length} facts (${stale} stale) · ${m.episodes} past questions · ${m.tasks} agent tasks. ` +
      `Facts are linked to the code they're about; a fact turns stale when that code's AST fingerprint changes or a later PR touches it.</p>` +
      (m.facts.map(f => `<div class="msg bot fact"><div>${f.stale ? '<span class="badge stale">stale: code changed</span> ' : '<span class="badge">current</span> '}${esc(f.text)}</div>` +
        `<div class="muted">about ${f.about.map(a => `<code>${esc(a)}</code>`).join(' ')} · learned by ${esc(f.agent)} agent, ${new Date(f.created_at).toLocaleString()}</div></div>`).join('')
       || '<p class="muted">Nothing learned yet. Ask a question in the Ask tab.</p>');
    show(m.graph, 'Memory: facts and the code they are about');
  } catch (err) { $('#memoryOut').innerHTML = `<p style="color:var(--warn)">${esc(err.message)}</p>`; }
}
$('#reviewForm').onsubmit = async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button'); btn.disabled = true;
  $('#reviewOut').innerHTML = '<p class="muted">Impact → Historian → Reviewer, handing off through the graph… (about 30–60s)</p>';
  try {
    const r = await api('/api/review', { repo, pr:+$('#prNum').value, post:$('#post').checked, key:$('#reviewKey').value });
    const graphs = [];
    $('#reviewOut').innerHTML = `<p class="muted">Changed functions: ${esc(r.changed.join(', ') || 'none found')}</p>` +
      Object.entries(r.agents).map(([name, a]) => { graphs.push(a.graph); return `<div class="msg bot agent"><h3>${esc(name)} agent</h3>${md(a.answer)}${stepsHtml(a.steps)}</div>`; }).join('') +
      (r.posted ? `<p><a href="${esc(r.posted)}" target="_blank" rel="noopener">Comment posted on GitHub ↗</a></p>` : '');
    show(merge(graphs), `PR #${$('#prNum').value}: what the three agents traversed`);
  } catch (err) { $('#reviewOut').innerHTML = `<p style="color:var(--warn)">${esc(err.message)}</p>`; }
  btn.disabled = false;
};

selectRepo(repo);
</script>
</body>
</html>
