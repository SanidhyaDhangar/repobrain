[project]
name = "repobrain"
version = "0.1.0"
description = "An engineering agent that reasons over a FalkorDB graph of a repo: code, history, people and its own memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.8.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "openai>=3.31.0",
    "uvicorn[standard]>=0.54.0",
]
